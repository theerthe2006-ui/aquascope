databases:
  - name: aquascope-db
    databaseName: aquascope
    user: aquascope_user
    plan: free

services:
  - type: web
    name: aquascope-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    disk:
      name: aquascope-uploads
      mountPath: /var/data/aquascope/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: aquascope-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/aquascope/uploads
      - key: CORS_ALLOWED_ORIGINS
        sync: false
